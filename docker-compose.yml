#
# INSTALLATION:
# 1. Place this file in your installation directory (e.g., C:\rfbooking or ~/rfbooking)
# 2. Run: docker compose up -d
# 3. Open: http://localhost:8000
#
# DATA LOCATIONS:
# - Database: ./data/rfbooking.db
# - Config:   ./config/config.yaml
#
# CUSTOM PATHS (optional):
# Set environment variables before running docker compose:
#   RFBOOKING_DATA=/custom/path/data docker compose up -d
#
# DEBUGGING WITH BIND MOUNTS (optional):
# Uncomment the bind mounts below during local development if you want template,
# static, or Python code changes to be picked up without rebuilding the image.
# Keep them commented for normal installations, especially when this compose file
# is downloaded into a clean directory.

services:
  rfbooking:
    image: olegtok/rfbooking:latest
    container_name: rfbooking
    ports:
      - "${RFBOOKING_PORT:-8000}:8000"
    volumes:
      - ${RFBOOKING_DATA:-./data}:/data
      - ${RFBOOKING_CONFIG_DIR:-./config}:/app/config
      - ollama-data:/root/.ollama
      # Optional local debugging bind mounts. Uncomment to avoid rebuilding the
      # container after Python, template, or static asset changes.
      # - ./app:/app/app
      # - ./templates:/app/templates
      # - ./static:/app/static
    environment:
      - RFBOOKING_CONFIG=/app/config/config.yaml
    restart: unless-stopped
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 120s
      timeout: 10s
      retries: 3
      start_period: 120s

volumes:
  ollama-data:
    driver: local
